<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <!-- Primary SEO -->
  <title>Projects & Case Studies | Web Design Portfolio | Webfliq</title>
  <meta
    name="description"
    content="Explore Webfliq's portfolio of Webflow, Shopify, WordPress and custom website projects. See how we help businesses improve design, performance, conversions and growth."
  />
  <meta
    name="keywords"
    content="web design portfolio, web development portfolio, webflow projects, shopify projects, wordpress portfolio, website case studies, ecommerce website projects, ui ux portfolio"
  />
  <meta name="author" content="Webfliq" />
  <meta name="robots" content="index, follow" />
  <meta name="googlebot" content="index, follow" />
  <!-- Canonical -->
  <link rel="canonical" href="https://webfliq.com/projects" />
  <!-- Theme -->
  <meta name="theme-color" content="#07111f" />
  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Webfliq" />
  <meta property="og:url" content="https://webfliq.com/projects" />
  <meta property="og:title" content="Projects & Case Studies | Webfliq"/>
  <meta
    property="og:description"
    content="Browse our collection of Webflow, Shopify, WordPress and custom website projects built for growing brands."
  />
  <meta
    property="og:image"
    content="https://webfliq.com/assets/images/projects-og-image.jpg"
  />
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Projects & Case Studies | Webfliq" />
  <meta
    name="twitter:description"
    content="Real client projects focused on performance, design, conversions and measurable growth."
  />
  <meta
    name="twitter:image"
    content="https://webfliq.com/assets/images/projects-og-image.jpg"
  />

  <!-- Projects Page Schema -->
  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"CollectionPage",
    "name":"Webfliq Projects",
    "url":"https://webfliq.com/projects",
    "description":"Portfolio and case studies showcasing Webflow, Shopify, WordPress and custom website projects."
  }
  </script>

  <!-- Organization Schema -->
  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"ProfessionalService",
    "name":"Webfliq",
    "url":"https://webfliq.com",
    "logo":"https://webfliq.com/assets/images/logo.png",
    "description":"Web design and development agency specializing in Webflow, Shopify, WordPress and custom website solutions."
  }
  </script>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div data-component="navbar"></div>
    <main>
        <section class="page-hero">
            <div class="container hero-grid">
                <div class="reveal reveal-left active"><span class="eyebrow">Projects</span>
                    <h1>Selected work designed to look sharp and perform better.</h1>
                    <p class="lead">Filter projects by service type. If projects are more than eight, pagination appears
                        automatically.</p>
                </div>
                <div class="hero-media reveal reveal-right active">
                    <div class="hero-image-card"><img src="assets/projects-hero.png"
                            alt="Portfolio project previews"></div>
                </div>
            </div>
        </section>
        <section class="section-gradient" data-project-root data-per-page="8">
            <div class="container">
                <div class="project-tools reveal reveal-up"><button class="filter-btn active" data-filter="All"
                        type="button">All</button><button class="filter-btn" data-filter="Webflow"
                        type="button">Webflow</button><button class="filter-btn" data-filter="Shopify"
                        type="button">Shopify</button><button class="filter-btn" data-filter="WordPress"
                        type="button">WordPress</button><button class="filter-btn" data-filter="Custom"
                        type="button">Custom</button><button class="filter-btn" data-filter="UI/UX"
                        type="button">UI/UX</button><button class="filter-btn" data-filter="Wix"
                        type="button">Wix</button></div>
                <div class="projects-grid">
                    <a class="project-card reveal reveal-up" href="https://example.com/project-2" target="_blank"
                        data-category="Shopify">
                        <div class="project-image"><img src="assets/images/project-2.jpg" alt="Luma Fashion Store">
                        </div>
                        <div class="project-content"><span class="tag">Shopify</span>
                            <h3>Luma Fashion Store</h3>
                            <p>A premium Shopify store with product storytelling and conversion tracking.</p><span
                                class="project-link">Open project <img class="theme-icon theme-icon-dark" src="assets/next-arrow-light.svg" alt="arrow Icon">
                                <img class="theme-icon theme-icon-light" src="assets/next-arrow-dark.png" alt="arrow Icon"></span>
                        </div>
                    </a>
                </div>
                <div class="pagination" data-pagination><button class="pagination-btn" data-prev
                        type="button">←</button>
                    <div data-page-numbers></div><button class="pagination-btn" data-next type="button">→</button>
                </div>
            </div>
        </section>
    </main>
    <div data-component="footer"></div>
    <script src="main.js"></script>
</body>

</html>
