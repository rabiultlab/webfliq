<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | webfliq</title>
    <meta name="description"
        content="Explore webfliq projects across Webflow, WordPress, Shopify, Wix, UI/UX, and custom web development.">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div data-component="navbar"></div>
    <main>
        <section class="page-hero">
            <div class="container hero-grid">
                <div class="reveal reveal-left active"><span class="eyebrow">Projects</span>
                    <h1>Selected work designed to look sharp and perform better.</h1>
                    <p class="lead">Filter projects by service type. If projects are more than eight, pagination appears
                        automatically.</p>
                </div>
                <div class="hero-media reveal reveal-right active">
                    <div class="hero-image-card"><img src="assets/images/projects-hero.jpg"
                            alt="Portfolio project previews"></div>
                </div>
            </div>
        </section>
        <section class="section-gradient" data-project-root data-per-page="8">
            <div class="container">
                <div class="project-tools reveal reveal-up"><button class="filter-btn active" data-filter="All"
                        type="button">All</button><button class="filter-btn" data-filter="Webflow"
                        type="button">Webflow</button><button class="filter-btn" data-filter="Shopify"
                        type="button">Shopify</button><button class="filter-btn" data-filter="WordPress"
                        type="button">WordPress</button><button class="filter-btn" data-filter="Custom"
                        type="button">Custom</button><button class="filter-btn" data-filter="UI/UX"
                        type="button">UI/UX</button><button class="filter-btn" data-filter="Wix"
                        type="button">Wix</button></div>
                <div class="projects-grid">
                    <a class="project-card reveal reveal-up" href="https://example.com/project-2" target="_blank"
                        data-category="Shopify">
                        <div class="project-image"><img src="assets/images/project-2.jpg" alt="Luma Fashion Store">
                        </div>
                        <div class="project-content"><span class="tag">Shopify</span>
                            <h3>Luma Fashion Store</h3>
                            <p>A premium Shopify store with product storytelling and conversion tracking.</p><span
                                class="project-link">Open project <img class="theme-icon theme-icon-dark" src="assets/next-arrow-light.svg" alt="arrow Icon">
                                <img class="theme-icon theme-icon-light" src="assets/next-arrow-dark.png" alt="arrow Icon"></span>
                        </div>
                    </a>
                </div>
                <div class="pagination" data-pagination><button class="pagination-btn" data-prev
                        type="button">←</button>
                    <div data-page-numbers></div><button class="pagination-btn" data-next type="button">→</button>
                </div>
            </div>
        </section>
    </main>
    <div data-component="footer"></div>
    <script src="main.js"></script>
</body>

</html>
